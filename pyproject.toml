[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garage-rag"
version = "0.5.1"
description = "Local multilingual retrieval over automotive owner documentation"
keywords = ["rag", "automotive", "multilingual", "qdrant", "grounded-generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "langchain-core==1.7.0",
  "langgraph==1.2.17",
  "sentence-transformers==6.2.0",
  "qdrant-client==1.20.0",
  "pypdf==6.21.2",
  "fonttools==4.67.0",
  "python-dotenv==1.2.4",
  "lingua-language-detector==2.2.0",
]

[project.optional-dependencies]
dev = ["build==1.6.1", "pytest==9.1.1", "reportlab==5.1.0", "ruff==0.17.2"]

[project.urls]
Repository = "https://github.com/cryptoadya/garage-rag"
Documentation = "https://github.com/cryptoadya/garage-rag#readme"
Issues = "https://github.com/cryptoadya/garage-rag/issues"
Changelog = "https://github.com/cryptoadya/garage-rag/blob/main/CHANGELOG.md"

[project.scripts]
garage-rag = "garage_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garage_rag"]

# Public Python/UI sources, docs, test fixtures and frozen benchmarks only.
[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/README.md", "/CHANGELOG.md",
  "/LICENSE", "/pyproject.toml", "/.env.example", "/benchmarks/*.json",
  "/frontend/index.html", "/frontend/package.json", "/frontend/package-lock.json",
  "/frontend/tsconfig.json", "/frontend/vite.config.ts", "/frontend/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
